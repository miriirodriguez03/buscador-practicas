name: Buscar ofertas de prácticas

# La búsqueda programada se hace desde el PC (ejecutar_local.ps1 + instalar_tarea.ps1)
# porque Workday responde 429 a todas las peticiones que salen de GitHub.
# Este workflow queda solo para lanzarlo a mano. Si algún día vuelve a funcionar
# desde GitHub, basta con añadir de nuevo:
#   schedule:
#     - cron: "17 7,16 * * *"
# (y quitar la tarea del PC, para que no se ejecuten los dos a la vez).
on:
  workflow_dispatch:          # permite lanzarlo a mano con un botón

permissions:
  contents: write   # para guardar ofertas_vistas.csv
  issues: write     # para crear los avisos

# Nunca dos ejecuciones a la vez: se pisarían al guardar ofertas_vistas.csv
concurrency:
  group: buscar-ofertas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Buscar ofertas
        run: python buscar_ofertas.py

      # Los avisos se crean ANTES de guardar la lista de ofertas vistas.
      # Si crear un aviso falla, la lista no se guarda y la próxima ejecución
      # vuelve a avisar de esas ofertas: mejor un aviso repetido que uno perdido.
      - name: Preparar las etiquetas de los avisos
        if: hashFiles('nuevas_espana.md', 'nuevas_internacional.md') != ''
        run: |
          gh label create "España" --color "C60B1E" --description "Ofertas ubicadas en España" --force
          gh label create "Internacional" --color "1D76DB" --description "Ofertas fuera de España" --force

      - name: Aviso de ofertas en España
        if: hashFiles('nuevas_espana.md') != ''
        run: gh issue create --title "🇪🇸 Ofertas en España – $(date +%d/%m/%Y)" --label "España" --body-file nuevas_espana.md

      - name: Aviso de ofertas en otros países
        if: hashFiles('nuevas_internacional.md') != ''
        run: gh issue create --title "🌍 Ofertas en otros países – $(date +%d/%m/%Y)" --label "Internacional" --body-file nuevas_internacional.md

      - name: Guardar la lista de ofertas vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas_vistas.csv
          if git diff --cached --quiet; then
            echo "No hay cambios en ofertas_vistas.csv"
            exit 0
          fi
          git commit -m "Ofertas actualizadas $(date +%F)"
          # Si mientras tanto has subido cambios (p. ej. editando config.yaml),
          # se integran antes de subir para que el push no falle.
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "El push ha fallado (intento $intento); reintentando en 10 s"
            sleep 10
          done
          exit 1
