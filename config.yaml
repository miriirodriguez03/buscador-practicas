# ─────────────────────────────────────────────────────────────

# Tu nombre de usuario de GitHub, sin @ (para que te llegue el aviso)
usuario_github: miriirodriguez03

# Lo que el programa escribe en el buscador de cada portal
terminos_busqueda:
  - intern
  - internship
  - trainee
  - thesis
  - working student

# El TÍTULO de la oferta debe contener al menos una de estas palabras.
# Escríbelas sin tildes (practicas, no prácticas): el programa ignora las tildes.
palabras_titulo:
  - intern
  - internship
  - interns
  - trainee
  - thesis
  - working student
  - werkstudent
  - praktikum
  - praktikant
  - practicas
  - becario
  - stage
  - co-op

# Si el título contiene alguna de estas, la oferta se descarta
palabras_excluidas:
  - senior
  - manager
  - director
  - principal

# Países o ciudades que te interesan, en INGLÉS (Spain, Germany...).
# Para no filtrar por ubicación, borra la lista y deja:  ubicaciones: []
ubicaciones:
  - Spain
  - Germany
  - Netherlands
  - Switzerland

# Empresas que usan Workday. Copia el bloque de 2 líneas para añadir más.
